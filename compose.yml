services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.production
    image: ghost-app:latest
    ports:
      - "2368:2368"
    environment:
      NODE_ENV: production
      RAILS_ENV: production
      GHOST_BUILD_VERSION: ""
      server__host: 0.0.0.0
      server__port: "2368"
      database__client: mysql2
      database__connection__host: db
      database__connection__user: ghost
      database__connection__password: ghost
      database__connection__database: ghost_dev
      mail__transport: SMTP
      mail__options__host: mailpit
      mail__options__port: "1025"
      adapters__cache__Redis__host: redis
      adapters__cache__Redis__port: "6379"
      storage__S3Storage__endpoint: http://minio:9000
      storage__S3Storage__accessKeyId: minio-user
      storage__S3Storage__secretAccessKey: minio-pass
      analytics__url: http://analytics:3000
      TB_HOST: http://tinybird-local:7181
      tinybird__stats__endpoint: http://tinybird-local:7181
      logging__level: debug
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_started
      minio:
        condition: service_started
      tinybird-local:
        condition: service_started
      analytics:
        condition: service_started
    stdin_open: true
    tty: true
    restart: on-failure
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://127.0.0.1:2368/ghost/', res => process.exit(res.statusCode < 500 ? 0 : 1)).on('error', () => process.exit(1))\" || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 120s

  db:
    image: mysql:8.4.5
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: ghost_dev
      MYSQL_USER: ghost
      MYSQL_PASSWORD: ghost
    ports:
      - "3306:3306"
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2024-12-13T22-19-12Z
    environment:
      MINIO_ROOT_USER: minio-user
      MINIO_ROOT_PASSWORD: minio-pass
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  tinybird-local:
    image: tinybirdco/tinybird-local:latest
    ports:
      - "7181:7181"
    restart: unless-stopped

  analytics:
    image: ghost/traffic-analytics:1.0.175
    ports:
      - "3000:3000"
    depends_on:
      tinybird-local:
        condition: service_started
    restart: unless-stopped

volumes:
  db-data:
  redis-data:
  minio-data:
