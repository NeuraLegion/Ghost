services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.production
      target: core
    environment:
      NODE_ENV: production
      url: http://localhost:2368
      server__host: 0.0.0.0
      GHOST_URL: http://ghost:2368/
      GHOST_CDN_URL: ./
      database__client: mysql2
      database__connection__host: mysql
      database__connection__port: 3306
      database__connection__user: ghost
      database__connection__password: ghost
      database__connection__database: ghost_dev
      mail__transport: SMTP
      mail__options__host: mailpit
      mail__options__port: 1025
      adapters__cache__Redis__host: redis
      adapters__cache__Redis__port: 6379
      storage__S3Storage__endpoint: http://minio:9000
      storage__S3Storage__forcePathStyle: "true"
      storage__S3Storage__accessKeyId: minio-user
      storage__S3Storage__secretAccessKey: minio-pass
    ports:
      - "2368:2368"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_started
      minio:
        condition: service_started
    stdin_open: true
    tty: true
    restart: on-failure
    healthcheck:
      test: ["CMD-SHELL", "(curl -fsS http://localhost:2368/ghost/api/admin/site/ || wget -qO- http://localhost:2368/ghost/api/admin/site/) >/dev/null"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s

  mysql:
    image: mysql:8.4.5
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: ghost_dev
      MYSQL_USER: ghost
      MYSQL_PASSWORD: ghost
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2024-12-13T22-19-12Z
    environment:
      MINIO_ROOT_USER: minio-user
      MINIO_ROOT_PASSWORD: minio-pass
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  mysql-data:
  redis-data:
  minio-data:
