services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.production
    image: ghost-app:local
    ports:
      - "2368:2368"
    environment:
      NODE_ENV: production
      GHOST_BUILD_VERSION: ""
      database__client: mysql2
      database__connection__host: mysql
      database__connection__user: ghost
      database__connection__password: ghost
      database__connection__database: ghost_dev
      server__host: 0.0.0.0
      server__port: "2368"
      mail__transport: SMTP
      mail__options__host: mailpit
      mail__options__port: "1025"
      adapters__cache__Redis__host: redis
      adapters__cache__Redis__port: "6379"
      spam__global_block__freeRetries: "999999"
      spam__global_block__minWait: "0"
      spam__global_block__maxWait: "1"
      spam__global_block__lifetime: "1"
      spam__global_reset__freeRetries: "999999"
      spam__global_reset__minWait: "0"
      spam__global_reset__maxWait: "1"
      spam__global_reset__lifetime: "1"
      spam__user_login__freeRetries: "999999"
      spam__user_login__minWait: "0"
      spam__user_login__maxWait: "1"
      spam__user_login__lifetime: "1"
      spam__user_reset__freeRetries: "999999"
      spam__user_reset__minWait: "0"
      spam__user_reset__maxWait: "1"
      spam__user_reset__lifetime: "1"
      spam__send_verification_code__freeRetries: "999999"
      spam__send_verification_code__minWait: "0"
      spam__send_verification_code__maxWait: "1"
      spam__send_verification_code__lifetime: "1"
      spam__user_verification__freeRetries: "999999"
      spam__user_verification__minWait: "0"
      spam__user_verification__maxWait: "1"
      spam__user_verification__lifetime: "1"
      spam__member_login__freeRetries: "999999"
      spam__member_login__minWait: "0"
      spam__member_login__maxWait: "1"
      spam__member_login__lifetime: "1"
      spam__content_api_key__freeRetries: "999999"
      spam__content_api_key__minWait: "0"
      spam__content_api_key__maxWait: "1"
      spam__content_api_key__lifetime: "1"
      spam__private_block__freeRetries: "999999"
      spam__private_block__minWait: "0"
      spam__private_block__maxWait: "1"
      spam__private_block__lifetime: "1"
      spam__webmentions_block__freeRetries: "999999"
      spam__webmentions_block__minWait: "0"
      spam__webmentions_block__maxWait: "1"
      spam__webmentions_block__lifetime: "1"
      spam__email_preview_block__freeRetries: "999999"
      spam__email_preview_block__minWait: "0"
      spam__email_preview_block__maxWait: "1"
      spam__email_preview_block__lifetime: "1"
      spam__otc_verification_enumeration__freeRetries: "999999"
      spam__otc_verification_enumeration__minWait: "0"
      spam__otc_verification_enumeration__maxWait: "1"
      spam__otc_verification_enumeration__lifetime: "1"
      spam__otc_verification__freeRetries: "999999"
      spam__otc_verification__minWait: "0"
      spam__otc_verification__maxWait: "1"
      spam__otc_verification__lifetime: "1"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_started
    stdin_open: true
    tty: true
    restart: on-failure
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://127.0.0.1:2368/ghost/',res=>process.exit(res.statusCode < 500 ? 0 : 1)).on('error',()=>process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  mysql:
    image: mysql:8.4.5
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: ghost_dev
      MYSQL_USER: ghost
      MYSQL_PASSWORD: ghost
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -proot"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  redis:
    image: redis:7.0-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"
    restart: unless-stopped

volumes:
  mysql-data:
  redis-data:
